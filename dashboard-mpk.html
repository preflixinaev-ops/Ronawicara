<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard MPK - Ronawicara</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #F1F5F9; color: #1E293B; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 650px; width: 100%; background: #FFF; padding: 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #0284C7; margin-bottom: 16px; font-size: 20px; font-weight: 800; }
        .auth-box { text-align: center; padding: 30px 10px; }
        input[type="password"] { padding: 13px; width: 100%; border: 1.5px solid #CBD5E1; border-radius: 12px; margin-bottom: 14px; outline: none; text-align: center; font-size: 16px; }
        .btn { padding: 13px 20px; background: #0284C7; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; font-size: 14px; }
        .btn:hover { background: #0369A1; }
        .card { background: #F8FAFC; border: 1px solid #E2E8F0; padding: 16px; border-radius: 14px; margin-bottom: 12px; }
        .badge { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 12px; text-transform: uppercase; }
        .badge-aspirasi { background: #FEF9E7; color: #854D0E; border: 1px solid #FEF08A; }
        .badge-kritik { background: #FFE4E6; color: #9F1239; border: 1px solid #FECDD3; }
        .badge-saran { background: #DCFCE7; color: #166534; border: 1px solid #BBF7D0; }
    </style>
</head>
<body>

<div class="container">
    <!-- Pintu Masuk / PIN -->
    <div id="loginSection" class="auth-box">
        <h2>🔒 Dashboard Pengurus MPK</h2>
        <p style="font-size: 13px; color: #64748B; margin-bottom: 18px;">Masukkan PIN khusus pengurus untuk melihat aspirasi masuk.</p>
        <input type="password" id="pinInput" placeholder="Masukkan PIN Rahasia">
        <button class="btn" onclick="login()">Masuk ke Dashboard</button>
    </div>

    <!-- Panel Data -->
    <div id="panelSection" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
            <h2>Kotak Aspirasi Masuk</h2>
            <button onclick="loadData()" style="padding: 8px 14px; background: #0284C7; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px;">🔄 Refresh Data</button>
        </div>
        <div id="listData"></div>
    </div>
</div>

<script>
    // MASUKKAN URL GOOGLE APPS SCRIPT-MU DI SINI
    const SCRIPT_URL = "URL_GOOGLE_APPS_SCRIPT_KAMU";
    const PIN_ADMIN = "123456"; // Atur PIN akses pengurus MPK di sini

    function login() {
        const pin = document.getElementById('pinInput').value;
        if(pin === PIN_ADMIN) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('panelSection').style.display = 'block';
            loadData();
        } else {
            alert('PIN yang Anda masukkan salah!');
        }
    }

    function loadData() {
        const box = document.getElementById('listData');
        box.innerHTML = "<p style='text-align:center; color:#64748B;'>Memuat data dari database...</p>";

        fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            box.innerHTML = "";
            if(!data || data.length === 0) {
                box.innerHTML = "<p style='text-align:center; color:#64748B;'>Belum ada pesan masuk.</p>";
                return;
            }
            data.reverse().forEach(item => {
                const bClass = item.kategori === 'Kritik' ? 'badge-kritik' : item.kategori === 'Saran' ? 'badge-saran' : 'badge-aspirasi';
                box.innerHTML += `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <strong style="font-size:14px;">${item.nama} (${item.kelas})</strong>
                            <span class="badge ${bClass}">${item.kategori}</span>
                        </div>
                        <p style="font-size:13px; color:#334155; line-height:1.5;">${item.pesan}</p>
                    </div>
                `;
            });
        })
        .catch(err => {
            box.innerHTML = "<p style='text-align:center; color:#EF4444;'>Gagal mengambil data. Pastikan SCRIPT_URL sudah terpasang dengan benar.</p>";
        });
    }
</script>
</body>
</html>
